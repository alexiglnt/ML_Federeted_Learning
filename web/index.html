<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machining model platform</title>
    <meta
      name="description"
      content="Pool machining measurements across labs. Create a project, contribute data, and share the resulting models."
    />
    <script>
      /* Before the stylesheet and before the body, so a visitor who chose dark
         last time does not get a flash of light theme on load. */
      try {
        if (localStorage.getItem("mlfl-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (_) {
        /* localStorage can throw in a locked-down browser; the default is fine. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
