services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # server/store/ vit hors de l'image : c'est ce qui fait que les
    # contributions reçues et les versions publiées survivent à un
    # `docker compose up --build` (mise à jour du code).
    volumes:
      - ./server/store:/app/server/store
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
